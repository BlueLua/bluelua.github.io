name: Markdownlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/markdownlint.yml"
      - ".markdownlint.jsonc"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/markdownlint.yml"
      - ".markdownlint.jsonc"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
