name: StyLua

on:
  workflow_call:

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve paths
        id: paths
        run: |
          if [ -d src ]; then
            echo "paths=src" >> "$GITHUB_OUTPUT"
          else
            echo "paths=lua" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ github.token }}
          version: latest
          args: --check ${{ steps.paths.outputs.paths }}
